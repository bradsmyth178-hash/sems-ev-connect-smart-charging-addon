name: Validate Home Assistant app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant app metadata
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./smart-charging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.2
      - run: python tests/validate_structure.py
